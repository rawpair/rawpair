# Container deployment only. Native nginx assets live under native/.
worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  resolver 127.0.0.11 valid=30s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  limit_req_zone $binary_remote_addr zone=rawpair_login:10m rate=5r/m;
  server {
    listen 443 ssl;
    server_name ${PHX_HOST};
    ssl_certificate /etc/rawpair/tls/cert.pem;
    ssl_certificate_key /etc/rawpair/tls/key.pem;
    client_max_body_size 16m;
    location /internal/ { return 404; }
    location = /__terminal_auth {
      internal;
      proxy_pass http://rawpair:4000/internal/terminal/$terminal_id;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Rawpair-Gateway "${RAWPAIR_GATEWAY_TOKEN}";
    }
    location ~ ^/terminal/(?<terminal_id>docker-[0-9]+)(?<terminal_tail>/.*)$ {
      auth_request /__terminal_auth;
      auth_request_set $terminal_container $upstream_http_x_docker_terminal_container;
      proxy_pass http://$terminal_container:7681$terminal_tail$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_read_timeout 86400s;
      proxy_buffering off;
    }
    location /terminal/ { return 404; }
    location /collaboration/ {
      proxy_pass http://yjs:1234;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Origin $http_origin;
      proxy_set_header Cookie "";
      proxy_buffering off;
      proxy_read_timeout 86400s;
      access_log off;
    }
    location = /enter {
      limit_req zone=rawpair_login burst=5 nodelay;
      proxy_pass http://rawpair:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
    location / {
      proxy_pass http://rawpair:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
