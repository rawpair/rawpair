project_name: rawpair

builds:
  - id: rawpair
    main: ./cli/main.go
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - riscv64
    goarm:
      - 7
    ldflags:
      - -s -w -X github.com/rawpair/rawpair/cli/cmd.Version={{.Version}}
    env:
      - CGO_ENABLED=0

archives:
  - format: tar.gz
    files:
      - none*

release:
  draft: true
  github:
    owner: rawpair
    name: rawpair
